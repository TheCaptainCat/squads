[project]
name = "squads"
version = "0.19.0"
description = "The coordination layer for a team of AI agents working on one codebase: stable JIRA-like IDs, roles & skills, a status lifecycle, and handoffs in predictable markdown."
readme = "PYPI.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pierre Chat", email = "pierrechat@outlook.com" },
    { name = "Claude", email = "noreply@anthropic.com" },
]
keywords = ["ai", "agents", "claude", "cli", "project-management", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    # Held to one minor series: the daemon replaces typer.rich_utils._get_rich_console for served
    # commands (squads/_daemon/_proxies.py), and a test pins that function's shape.
    "typer>=0.27.3,<0.28",
    "pydantic>=2.14.2",
    "jinja2>=3.1.6",
    "filelock>=4.2.4",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "anyio>=4.15.1",
    "babel>=2.18",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
tui = ["textual>=8.2.8"]

[project.scripts]
squads = "squads.__main__:main"
sq = "squads.__main__:main"

[project.urls]
Homepage = "https://github.com/TheCaptainCat/squads"
Repository = "https://github.com/TheCaptainCat/squads"
Issues = "https://github.com/TheCaptainCat/squads/issues"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "freezegun>=1.5.5",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "anyio[trio]>=4.15.1",
    "vulture>=2.16",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squads"]

# Ship the repo-root docs inside the wheel as squads/_docs/ so `sq docs` can print them
# offline (no fetch). Editable installs don't materialize this — _docfiles falls back to docs/.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "squads/_docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` (pytest-xdist): parallel by default, local + CI; `-n0` forces serial (not `-p no:xdist`,
# which unloads the plugin but leaves `-n auto` in addopts, so it errors as an unrecognized arg).
addopts = "-q -n auto"
anyio_mode = "auto"
# A test that hangs is named and fails after this many seconds. The log holds every thread's
# stack under `-n0` only. The thread method also ends a hang no signal can interrupt, as on
# Windows.
timeout = 300
timeout_method = "thread"
# Keep only the latest run's tmp dirs: /tmp is a small tmpfs that a full run can fill.
tmp_path_retention_count = 1
markers = [
    "breaches(*declarations): declares the sq check rules, `rule:param` cases and `rule@level` cases a test breaches; read by ast by the guard in tests/meta and checked against the findings the test's check_json runs report",
    "covers(key, *params): declares the CLI (command key, parameter) pairs a test exercises; read by ast by the coverage guard in tests/meta and checked against the calls the test makes",
    "bundled_only(reason): the case is about the bundled squad's own spelling and is skipped on the override squad; the reason says why",
    "override_only(reason): the case is about the override squad's own spelling and is skipped on the bundled squad; the reason says why",
    "slow: marks tests that generate large data sets or have wall-clock bounds (skipped by default, opt in with --run-slow)",
    "gate_for(site): declares that this test's own falsification proves a gated view-tag writer site (module-relative-path::function); collected by tests/meta's writer-scan citation check instead of a hand-maintained dict",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# clients/ is a self-contained TypeScript/Node package with its own gate; a stray
# .ts/node_modules there must never fail a Python run. squads/ holds sq-managed item files, never
# reformatted by hand (ruff formats the Python blocks in Markdown); docs/backends.md keeps its
# signature sketches as written.
extend-exclude = ["clients", "./squads", "docs/backends.md"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "W",          # base
    "C901",                                  # cyclomatic complexity
    "SIM", "PERF", "PTH", "RUF",             # smells / perf / pathlib / ruff
    "TRY",                                   # exception hygiene
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # too many returns/branches/args/statements
    "ASYNC",                                 # blocking calls inside async fns
    "ERA",                                   # commented-out code
]
# RUF029 (async function without `await`) is a preview rule. `explicit-preview-rules` keeps every
# other preview rule off, the `RUF` prefix included, but preview also turns on the preview
# behaviour of already-selected stable rules (F401, F811, SIM102 fixes, ...): none changes the
# findings at ruff 0.17.3, so re-measure on a ruff bump.
preview = true
explicit-preview-rules = true
extend-select = ["RUF029"]
ignore = [
    "TRY003",  # long messages in raise() are intentional (user-facing SquadsError text)
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Typer relies on function calls (Option/Argument) as parameter defaults.
"src/squads/_cli/*" = ["B008"]
# tests favour readability over these rules; ERA001 false-positives heavily on our
# section-divider comments ("# Label: word", "# Label (word)") and the verbatim-quoted
# docstring text in the backend-conformance findings catalogue
# RUF029: async tests with no `await` run on the event loop under anyio_mode = "auto"; they are
# left as written.
"tests/*" = ["PLR2004", "PLR0913", "S101", "ERA001", "RUF029"]
"conftest.py" = ["ERA001"]

[tool.pyright]
include = ["src", "tests", "conftest.py"]
# Belt-and-suspenders alongside `include` above: clients/ is a self-contained TypeScript/Node
# package with its own gate; a stray .ts/node_modules there must never fail pyright.
exclude = ["clients"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# pytest injects fixtures by parameter name, so their types are not statically
# inferable: strict's "unknown type" family is pure noise on tests. Silence only
# that family for the tests subtree; every other strict check still applies.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportPrivateUsage = "none"

# vulture: periodic, non-gating dead-code scan (see CLAUDE.md). Suppresses framework
# false-positive categories only — Typer/pydantic decorators, plus test-only public
# API vulture can't see because it scans src/squads only. No `get_*`-style wildcards
# (would mask real dead code).
[tool.vulture]
paths = ["src/squads"]
min_confidence = 60
ignore_decorators = [
    "@*.command",
    "@*.callback",
    "@field_validator",
    "@model_validator",
    "@computed_field",
]
ignore_names = [
    # pydantic ConfigDict class attribute — consumed by the metaclass, not by name.
    "model_config",
    # Typer reads these off the dynamically-built generic sub-entity command
    # functions (_cli/_items.py's add-<kind>/update builders) at runtime.
    "__signature__",
    "__doc__",
    # Grant.ground: the reason an operation runs past the schema gate, declared and not read.
    "ground",
]
