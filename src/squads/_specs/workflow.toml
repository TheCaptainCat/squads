# squads default workflow specification
# Encodes the vocabulary byte-for-byte, including capability flags (category,
# subentity_kind, parent_required, ref_rules) and StatusSpec.role.
# Loaded and validated by load_workflow_spec() in _loader.py.
# DO NOT edit without updating the golden-lock test in tests/unit/test_workflow_spec_artifact.py.
#
# [collections.*] + the `fields` lists below are the badge vocabulary — the bundled
# priority/severity collections/fields ARE the runtime vocabulary now (no more Priority/Severity
# enums); "does type/kind X carry field Y" is a fields_for(X) lookup.
#
# [roles.*] is the role catalog — the sole explicit status axis. Every status below names one
# role via `role`; the role object carries `settled`/`hidden`/`color`/`live` (terminal/
# is_open/default-visibility/materialisation are all derived from the referenced role, never
# stored per-status). `badge` stays its own independent per-status field.

# ---------------------------------------------------------------------------
# Named lifecycle state machines — item lifecycles and sub-entity lifecycles
# all live in one merged namespace (names don't collide).
#
# Item lifecycles:    work, adr, contract, milestone, review, bug, guide, agent
# Sub-entity kinds:   story + subtask share `subentity`; finding has its own `finding`
#   (bound via subentity_kinds.<kind>.lifecycle, not by kind-name==lifecycle-name)
# ---------------------------------------------------------------------------

[lifecycles.work]
# Work items: Draft → Ready → InProgress → InReview → Done (+ Blocked, Cancelled)
initial = "Draft"

[lifecycles.work.transitions]
Draft = ["Ready", "InProgress", "Cancelled"]
Ready = ["InProgress", "Blocked", "Cancelled"]
InProgress = ["InReview", "Blocked", "Done", "Cancelled"]
InReview = ["InProgress", "Done", "Blocked", "Cancelled"]
Blocked = ["Ready", "InProgress", "Cancelled"]
Done = ["InProgress"]
Cancelled = ["Draft"]

[lifecycles.adr]
# ADR: Proposed → Accepted → Superseded (+ Rejected, Deprecated)
initial = "Proposed"

[lifecycles.adr.transitions]
Proposed = ["Accepted", "Rejected"]
Accepted = ["Superseded", "Deprecated"]
Rejected = ["Proposed"]
Superseded = []
Deprecated = []

[lifecycles.contract]
# Contract: Draft → Active → Superseded (+ Deprecated, with a revive edge back to Active).
# Not the work lifecycle — a contract is rewritten in place, never burned down — and not the
# guide lifecycle either: "Published" carries no supersede semantics.
initial = "Draft"

[lifecycles.contract.transitions]
Draft = ["Active"]
Active = ["Superseded", "Deprecated"]
Superseded = []
Deprecated = ["Active"]

[lifecycles.milestone]
# Milestone: Draft → InProgress → Done (+ Cancelled), with revive edges back (Done →
# InProgress, Cancelled → Draft) — a milestone's own state tracks whether it's still being
# planned/pursued or settled, never the completeness of its members (that's the roll-up view).
initial = "Draft"

[lifecycles.milestone.transitions]
Draft = ["InProgress", "Cancelled"]
InProgress = ["Done", "Cancelled"]
Done = ["InProgress"]
Cancelled = ["Draft"]

[lifecycles.review]
# Code review: Requested → InReview → ChangesRequested → Approved (+ Rejected)
initial = "Requested"

[lifecycles.review.transitions]
Requested = ["InReview", "Rejected"]
InReview = ["ChangesRequested", "Approved", "Rejected"]
ChangesRequested = ["InReview", "Approved", "Rejected"]
Approved = []
Rejected = []

[lifecycles.bug]
# Bug: Open → InProgress → Fixed → Verified (+ WontFix, Blocked, Cancelled)
initial = "Open"

[lifecycles.bug.transitions]
Open = ["InProgress", "WontFix", "Cancelled"]
InProgress = ["Fixed", "Blocked", "WontFix", "Cancelled"]
Fixed = ["Verified", "InProgress"]
Verified = ["InProgress"]
Blocked = ["InProgress", "WontFix", "Cancelled"]
WontFix = ["Open"]
Cancelled = ["Open"]

[lifecycles.guide]
# Guide: Draft → Published → Deprecated
initial = "Draft"

[lifecycles.guide.transitions]
Draft = ["Published"]
Published = ["Deprecated", "Draft"]
Deprecated = ["Published"]

[lifecycles.agent]
# Role / Skill / Operator: Active ⇄ Archived. A roster entry is created directly at this
# lifecycle's own `initial` (the roster create verbs pass no status at all), so Draft is not a
# reachable state of this machine; Draft stays a declared global status (the work/guide
# lifecycles own it).
initial = "Active"

[lifecycles.agent.transitions]
Active = ["Archived"]
Archived = ["Active"]

# Sub-entity lifecycles. story and subtask share one machine (subentity_kinds.story/subtask
# both name it via `lifecycle`) — collapsing this from two identical tables is byte-identical
# now that the machine binding is explicit rather than kind-name-positional.

[lifecycles.subentity]
initial = "Todo"

[lifecycles.subentity.transitions]
Todo = ["InProgress", "Blocked", "Cancelled"]
InProgress = ["Done", "Blocked", "Cancelled"]
Blocked = ["InProgress", "Cancelled"]
Done = ["InProgress"]
Cancelled = ["Todo"]

[lifecycles.finding]
# Review findings: Open → Fixed → Verified (+ WontFix)
initial = "Open"

[lifecycles.finding.transitions]
Open = ["Fixed", "WontFix"]
Fixed = ["Verified", "Open"]
Verified = []
WontFix = ["Open"]

# ---------------------------------------------------------------------------
# Roles — the role catalog. Eight bundled roles; every status below names exactly one.
# `settled` is the old `terminal`; `hidden` is default-visibility; `color` is a semantic
# colour intent from the closed palette (positive/danger/warning/muted/neutral/info),
# mapped to a concrete colour per client (not here). `live` (defaults false) is the
# materialisation axis — the one bundled live role is `active`. `warning` is unused by
# the bundled defaults — reserved for adopters.
# ---------------------------------------------------------------------------

[roles.pending]
settled = false
hidden = false
color = "neutral"

[roles.active]
settled = false
hidden = false
color = "positive"
live = true

[roles.attention]
settled = false
hidden = false
color = "danger"

[roles.blocked]
settled = false
hidden = false
color = "danger"

[roles.in_force]
settled = true
hidden = false
color = "info"

[roles.done]
settled = true
hidden = true
color = "positive"

[roles.retired]
settled = true
hidden = true
color = "muted"

[roles.superseded]
settled = true
hidden = true
color = "muted"

# ---------------------------------------------------------------------------
# Statuses (role reference + optional sub-entity badge)
# Every status names one of the roles above. badge is declared for the 9 sub-entity statuses
# only; other statuses render the graceful default when their badge is looked up. The
# done-toggle target per sub-entity kind lives on subentity_kinds.<kind>.completion below, not
# here — "Fixed" carrying the non-settled "active" role (it's also the pending-verification bug
# item status) has no bearing on it being the finding kind's completion target; the two concepts
# are independent by design.
# ---------------------------------------------------------------------------

[statuses.Draft]
role = "pending"

[statuses.Ready]
role = "pending"

[statuses.InProgress]
badge = "🟡"
role = "active"

[statuses.InReview]
role = "active"

[statuses.Done]
badge = "🟢"
role = "done"

[statuses.Blocked]
badge = "🔴"
role = "blocked"

[statuses.Cancelled]
badge = "⚫"
role = "retired"

[statuses.Proposed]
role = "pending"

[statuses.Accepted]
role = "in_force"

[statuses.Superseded]
role = "superseded"

[statuses.Rejected]
role = "retired"

[statuses.Deprecated]
role = "retired"

[statuses.Requested]
role = "pending"

[statuses.ChangesRequested]
role = "active"

[statuses.Approved]
role = "done"

[statuses.Published]
role = "in_force"

[statuses.Active]
role = "active"

[statuses.Archived]
role = "retired"

[statuses.Todo]
badge = "⚪"
role = "pending"

[statuses.Open]
badge = "🔴"
role = "attention"

[statuses.Fixed]
badge = "🟡"
role = "active"

[statuses.Verified]
badge = "🟢"
role = "done"

[statuses.WontFix]
badge = "⚫"
role = "retired"

# ---------------------------------------------------------------------------
# Collections — reusable badge libraries. priority/severity are the sole vocabulary for
# those two axes (no more Priority/Severity enums) — codes/labels/emoji/default here ARE
# what renders, resolved via fields_for()/WorkflowSpec.collection() at runtime.
# ---------------------------------------------------------------------------

[collections.priority]
label = "Priority"
ordered = true
badges = [
  { code = "urgent", label = "Urgent", emoji = "🔴" },
  { code = "high",   label = "High",   emoji = "🟠" },
  { code = "medium", label = "Medium", emoji = "🟡" },
  { code = "low",    label = "Low",    emoji = "🟢" },
]

[collections.severity]
label = "Severity"
ordered = true
default = "medium"
badges = [
  { code = "critical", label = "Critical", emoji = "🔴" },
  { code = "high",     label = "High",     emoji = "🟠" },
  { code = "medium",   label = "Medium",   emoji = "🟡" },
  { code = "low",      label = "Low",      emoji = "🟢" },
  { code = "info",     label = "Info",     emoji = "🔵" },
]

# ---------------------------------------------------------------------------
# Ref kinds — the declared `refs` vocabulary ("ID" or "ID:kind"). `role` binds engine
# behaviour to a semantic instead of a spelling; a kind with no `role` is purely navigational.
# Exactly one kind must carry `role = "default"` — the kind a bare "ID" ref (no ":kind"
# suffix) decodes to. `direction` ("blocker"/"dependent") only ever accompanies
# `role = "dependency"`. `targets` declares no semantic — it is a navigational membership
# edge with no engine binding; an adopter-declared kind walks the same path.
# ---------------------------------------------------------------------------

[ref_kinds.related]
label = "Related"
hint = "Generic cross-reference (default)"
role = "default"

[ref_kinds.blocks]
label = "Blocks"
hint = "A is blocking B; B cannot proceed while A is open"
role = "dependency"
direction = "blocker"

[ref_kinds.depends-on]
label = "Depends on"
hint = "A depends on B; A cannot proceed while B is open"
role = "dependency"
direction = "dependent"

[ref_kinds.implements]
label = "Implements"
hint = "A implements the requirement or spec described by B"

[ref_kinds.fixes]
label = "Fixes"
hint = "A (the resolving work) fixes the problem tracked by B"

[ref_kinds.addresses]
label = "Addresses"
hint = "A (the resolving work) addresses or follows up on B (feedback, a review)"

[ref_kinds.supersedes]
label = "Supersedes"
hint = "A (a newer decision) supersedes B (an older one)"
role = "supersession"

[ref_kinds.duplicates]
label = "Duplicates"
hint = "A (a later filing) duplicates B (the original)"

[ref_kinds.scopes]
label = "Scopes"
hint = "A (a skill) is scoped to role B; B's generated pointer preloads A"
role = "preload"

[ref_kinds.targets]
label = "Targets"
hint = "A targets B — a navigational membership edge with no engine binding; its meaning is whatever reads it"

# ---------------------------------------------------------------------------
# Items (prefix / folder / lifecycle / parents / aliases)
# This table is the sole vocabulary source for prefix/folder/allowed-parents/aliases.
# parents = [] means unconstrained (any parent or none is valid).
#
# `order` is the explicit CLI registration/display order (ascending; type name breaks
# ties) — a float, deliberately spaced by 10 so a future type can be inserted between
# two existing ones (even fractionally, e.g. 25.5 between task and bug) without
# renumbering everything. Work types keep today's logical sequence; roster types
# (role/skill/operator) come after them for completeness, though they register via
# their own dedicated subcommands rather than this ordering. A type that omits
# `order` defaults to +inf (ItemSpec.order) — sorts after every value declared here.
# ---------------------------------------------------------------------------

[items.epic]
prefix = "EPIC"
folder = "epics"
lifecycle = "work"
parents = []
aliases = ["e"]
order = 10
category = "work"
validators = ["no_parent"]
ref_rules = []
fields = [{ code = "priority", label = "Priority", collection = "priority" }]
# subentity_kind absent → None (no sub-entities)
# parent_required absent → None (unconstrained; no_parent enforces epic as root)

[items.feature]
prefix = "FEAT"
folder = "features"
lifecycle = "work"
parents = ["epic"]
aliases = ["feat", "f"]
order = 20
category = "work"
subentity_kind = "story"
# The implements ref_rule types the edge (target = contract); the validator entry below
# selects it as an obligation once a contract exists in the corpus — no hint: contract
# guidance in parent_hint's invalid-parent message would be noise.
ref_rules = [{ kind = "implements", target = "contract" }]
validators = ["ref_rule_target_present:contract"]
fields = [{ code = "priority", label = "Priority", collection = "priority" }]
# parent_required absent → None (unconstrained — any parent or none is valid)

[items.task]
prefix = "TASK"
folder = "tasks"
lifecycle = "work"
parents = ["feature"]
aliases = ["t"]
order = 30
category = "work"
subentity_kind = "subtask"
# The feature whose stories a task's subtasks map onto (`add-subtask --story USn`), and the
# type the generated `--parent` examples name. It does NOT make the parent mandatory at
# create: `parents` above says a parent must be a feature *if* there is one, and a bare
# `sq create task` stays valid. A project that wants it mandatory adds "parent_present" to
# this type's `validators` — left off here on purpose, because the same validator set backs
# both the create gate and `sq check`, so turning it on would also error on every parentless
# task already on disk.
parent_required = "feature"
ref_rules = [
  { kind = "fixes", hint = "link a bug or review with `sq ref add <task> <id> --kind fixes|addresses`" },
  { kind = "addresses", hint = "link a bug or review with `sq ref add <task> <id> --kind fixes|addresses`" },
]
fields = [{ code = "priority", label = "Priority", collection = "priority" }]

[items.bug]
prefix = "BUG"
folder = "bugs"
lifecycle = "bug"
parents = []
aliases = ["b"]
order = 40
category = "work"
ref_rules = []
fields = [
  { code = "priority", label = "Priority", collection = "priority" },
  { code = "severity", label = "Severity", collection = "severity", required = false, default = "medium" },
]
# subentity_kind absent → None
# parent_required absent → None

[items.decision]
prefix = "ADR"
folder = "adrs"
lifecycle = "adr"
parents = []
aliases = ["dec", "d"]
order = 50
category = "records"
ref_rules = [{ kind = "supersedes", hint = "" }]
fields = [{ code = "priority", label = "Priority", collection = "priority" }]
# subentity_kind absent → None
# parent_required absent → None

[items.contract]
# The living functional twin of the ADR set (`decision` above): what the product does for a
# user, right now. One item per capability/user-facing area, no sub-entities — structurally
# a `guide`, not a `feature`.
prefix = "PRD"
folder = "contracts"
lifecycle = "contract"
parents = []
aliases = ["prd", "c"]
order = 55
category = "records"
ref_rules = [{ kind = "supersedes", hint = "" }]
fields = [{ code = "priority", label = "Priority", collection = "priority" }]
# subentity_kind absent → None (one item per capability area; sections stay ordinary headings)
# parent_required absent → None (a record relates to work through refs, never hierarchy)

[items.milestone]
# A named target for a set of work — a release, a cycle, anything work can be aimed at.
# Membership is never stored here: a work item joins by carrying a forward `targets` ref to
# the milestone (`sq <type> <n> ref add MILE-… --kind targets`), recovered by inversion. Not a
# build-lifecycle work item and hosts no sub-entities — `records`, like decision/contract/guide.
prefix = "MILE"
folder = "milestones"
lifecycle = "milestone"
parents = []
aliases = ["mile", "m"]
order = 57
category = "records"
ref_rules = []
fields = [{ code = "priority", label = "Priority", collection = "priority" }]
extra_fields = ["target_date"]
views = ["milestone_rollup"]
# subentity_kind absent → None (membership rides `targets` refs on the work item, not sub-entities)
# parent_required absent → None (a milestone relates to work through refs, never hierarchy)

[items.review]
prefix = "REV"
folder = "reviews"
lifecycle = "review"
parents = []
aliases = ["rev", "r"]
order = 60
category = "work"
subentity_kind = "finding"
ref_rules = []
fields = [{ code = "priority", label = "Priority", collection = "priority" }]
extra_fields = ["target_ref"]
# parent_required absent → None

[items.guide]
prefix = "GUIDE"
folder = "guides"
lifecycle = "guide"
parents = []
aliases = ["g"]
order = 70
category = "records"
ref_rules = []
fields = [{ code = "priority", label = "Priority", collection = "priority" }]
extra_fields = ["tags", "tech"]
# subentity_kind absent → None
# parent_required absent → None

[items.role]
prefix = "ROLE"
folder = "agents/roles"
lifecycle = "agent"
parents = []
aliases = []
order = 80
category = "roster"
ref_rules = []
# subentity_kind absent → None
# parent_required absent → None

[items.skill]
prefix = "SKILL"
folder = "agents/skills"
lifecycle = "agent"
parents = []
aliases = []
order = 90
category = "roster"
ref_rules = []
# subentity_kind absent → None
# parent_required absent → None

[items.operator]
prefix = "OP"
folder = "operators"
lifecycle = "agent"
parents = []
aliases = []
order = 100
category = "roster"
ref_rules = []
# subentity_kind absent → None
# parent_required absent → None

# ---------------------------------------------------------------------------
# Sub-entity kinds — machine binding (`lifecycle`) + done-toggle target (`completion`) +
# CLI/storage vocabulary (`plural`/`local_prefix`/`placeholder`/`maps_parent_story`) +
# field declarations (mirrors the item `fields` mechanism). `lifecycle` is an explicit
# reference, mirroring `ItemSpec.lifecycle` — story and subtask share `subentity`; a
# custom kind is likewise free to share a machine with another kind by naming it.
# `completion` must be a reachable, non-initial status of that lifecycle.
# ---------------------------------------------------------------------------

[subentity_kinds.story]
lifecycle = "subentity"
completion = "Done"
plural = "stories"
local_prefix = "US"
placeholder = "_Write the user story (e.g. “As an <role>, I want … so that …”) and its acceptance criteria here — free-form paragraphs or bullet lists._"

[subentity_kinds.subtask]
lifecycle = "subentity"
completion = "Done"
plural = "subtasks"
local_prefix = "ST"
placeholder = "_Describe this subtask here — free-form paragraphs or bullet lists._"
maps_parent_story = true

[subentity_kinds.finding]
lifecycle = "finding"
completion = "Fixed"
plural = "findings"
local_prefix = "F"
placeholder = "_Describe the finding, its impact, and a recommendation — free-form._"
fields = [
  { code = "severity", label = "Severity", collection = "severity", required = true, default = "medium" },
]

# ---------------------------------------------------------------------------
# Views — declared derived-view projections. A view has three parts and no fourth: `source`
# (the relation to project — a ref kind, a sub-entity collection, or a subtree), `fields`
# (the projected columns — a base attribute or a badge field the source's own type/kind
# declares), and its presentation, resolved by the view's own key at
# `templates/views/<name>.md.j2` (no separate `presentation` key — the identity IS the
# template path). Every view is computed fresh on every request; none is ever materialized
# into a body region.
#
# `milestone_rollup` is the one bundled view, and the only reason it's here rather than left
# for a project's own `.overrides/workflow.toml` is that something in this document actually
# consumes it: `items.milestone.views` (above) attaches it to `sq milestone <n> show`. Naming
# a bundled ref kind or item type as a source otherwise couples every project that later
# drops or renames it to keeping the view too — the right trade only for a view something
# reads, not for a demonstration nothing does. The attachment is what keeps this one honest
# under `[selected]`: dropping `milestone` from `selected.items` drops `items.milestone.views`
# with it, and the loader (`_prune_orphaned_type_owned_views`) then prunes `milestone_rollup`
# itself from the merged spec — no view left declared over a type that no longer exists, and
# no second `selected.views` line for an adopter to remember. A project's own view follows the
# same shape under `.overrides/workflow.toml`; `sq override scaffold workflow` has a worked
# example.
# ---------------------------------------------------------------------------

[views.milestone_rollup]
# Source: every item carrying a forward `targets` ref to this milestone, recovered by
# inverting stored forward edges — the milestone file itself is never touched. Delivered vs.
# outstanding is resolved by the *presentation* template off each member's own status role
# (`status_role`, not `status`) — never a literal status name, since members can span types
# and lifecycles a literal like "Done" would silently mis-group.
source = { kind = "ref", name = "targets" }
group_by = "status_role"
order_by = ["type", "id"]

[[views.milestone_rollup.fields]]
code = "id"
label = "Id"

[[views.milestone_rollup.fields]]
code = "type"
label = "Type"

[[views.milestone_rollup.fields]]
code = "status"
label = "Status"

[[views.milestone_rollup.fields]]
code = "status_role"
label = "Status role"

[[views.milestone_rollup.fields]]
code = "title"
label = "Title"

[[views.milestone_rollup.fields]]
code = "assignee"
label = "Assignee"
