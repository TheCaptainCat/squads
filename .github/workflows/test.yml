  client-budget:
    # A report, never a gate (ADR-1225 section 5): runner timings spread too widely to fail on.
    # The medians land in the job summary.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen --all-extras
      - name: Measure the client overhead
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/squad"
          cp .squads.toml "$RUNNER_TEMP/squad/"
          cp -r squads "$RUNNER_TEMP/squad/"
          SQ="$(uv run python -c 'import shutil; print(shutil.which("sq"))')"
          {
            echo '### Client overhead of `sq task 1220 show` against a daemon'
            echo '```'
            uv run python scripts/bench_remote_client.py --squad "$RUNNER_TEMP/squad" --sq "$SQ" --task 1220 --runs 31 || true
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: No daemon left running
        # Fails when a `squads daemon run` process or a daemon file outlives the tests, and prints
        # the daemon logs of the runtime directory. The directory is resolved by squads itself.
        if: always()
        shell: bash
