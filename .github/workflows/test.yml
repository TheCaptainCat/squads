name: test

# Path-scoped off TS-only changes: clients/vscode/** has its own dev-time gate
# (vscode-client.yml), so a TS-only or doc-only change skips the full Python OS matrix.
#
# Caveat: `main` has no required status checks today, so this is safe. If these jobs
# are ever made *required*, a paths-ignore-skipped run leaves them stuck "pending"
# forever and blocks merge — either don't mark them required, or add an always-running
# aggregation job (not path-filtered) for branch protection to require instead.
on:
  push:
    branches: [main]
    paths-ignore:
      - "clients/vscode/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "clients/vscode/**"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: manifest freshness
        run: python scripts/gen_template_manifest.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 10 }}
    env:
      SQUADS_DAEMON: "off"
    steps:
      # Full history and tags: the content-store rebuild resolves each indexed
      # version's artifacts out of its own release tag and refuses outright when
      # one is missing, so a shallow tagless checkout fails those tests for a
      # reason that has nothing to do with the code under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen --all-extras
      - name: pytest
        run: uv run pytest --ignore=tests/cross_process
      - name: No daemon left running
        # Fails when a `squads daemon run` process or a daemon file outlives the tests, and prints
        # the daemon logs of the runtime directory. The directory is resolved by squads itself.
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY'
          import os, subprocess, sys
          from squads._endpoint import runtime_directory
          if sys.platform == "win32":
              listing = ["powershell", "-NoProfile", "-Command",
                         'Get-CimInstance Win32_Process | ForEach-Object { "$($_.ProcessId) $($_.CommandLine)" }']
          else:
              listing = ["ps", "-eo", "pid=,args="]
          out = subprocess.run(listing, capture_output=True, text=True, check=True).stdout
          leaked = [line for line in out.splitlines() if "squads" in line and line.rstrip().endswith("daemon run")]
          runtime = runtime_directory(os.environ, sys.platform)
          files = sorted(p for p in runtime.glob("*") if p.suffix in (".json", ".sock")) if runtime.is_dir() else []
          for log in sorted(runtime.glob("*.log")) if runtime.is_dir() else []:
              print(f"--- {log}\n{log.read_text(errors='replace')[-4000:]}")
          for line in leaked:
              print(f"leaked daemon process: {line.strip()}")
          for path in files:
              print(f"leaked daemon file: {path}")
          sys.exit(1 if leaked or files else 0)
          PY

  override-squad:
    # The CLI surface suite on the override test squad, whose vocabulary shares nothing with the
    # bundled one: a case that passes on the bundled squad and fails here still names a bundled word.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQUADS_DAEMON: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen --all-extras
      - name: pytest on the override squad
        run: uv run pytest --squad override tests/cli
      - name: No daemon left running
        # Fails when a `squads daemon run` process or a daemon file outlives the tests, and prints
        # the daemon logs of the runtime directory. The directory is resolved by squads itself.
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY'
          import os, subprocess, sys
          from squads._endpoint import runtime_directory
          if sys.platform == "win32":
              listing = ["powershell", "-NoProfile", "-Command",
                         'Get-CimInstance Win32_Process | ForEach-Object { "$($_.ProcessId) $($_.CommandLine)" }']
          else:
              listing = ["ps", "-eo", "pid=,args="]
          out = subprocess.run(listing, capture_output=True, text=True, check=True).stdout
          leaked = [line for line in out.splitlines() if "squads" in line and line.rstrip().endswith("daemon run")]
          runtime = runtime_directory(os.environ, sys.platform)
          files = sorted(p for p in runtime.glob("*") if p.suffix in (".json", ".sock")) if runtime.is_dir() else []
          for log in sorted(runtime.glob("*.log")) if runtime.is_dir() else []:
              print(f"--- {log}\n{log.read_text(errors='replace')[-4000:]}")
          for line in leaked:
              print(f"leaked daemon process: {line.strip()}")
          for path in files:
              print(f"leaked daemon file: {path}")
          sys.exit(1 if leaked or files else 0)
          PY

  cross-process:
    # SQUADS_DAEMON is left unset: the daemon members start their own daemons.
    # The behaviours that need one process to find, outlive or wait for another (ADR-1172): the
    # real `sq` console script on a scratch squad, once per OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen --all-extras
      - name: pytest cross-process set
        run: uv run pytest -n0 -rs tests/cross_process
      - name: No daemon left running
        # Fails when a `squads daemon run` process or a daemon file outlives the tests, and prints
        # the daemon logs of the runtime directory. The directory is resolved by squads itself.
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY'
          import os, subprocess, sys
          from squads._endpoint import runtime_directory
          if sys.platform == "win32":
              listing = ["powershell", "-NoProfile", "-Command",
                         'Get-CimInstance Win32_Process | ForEach-Object { "$($_.ProcessId) $($_.CommandLine)" }']
          else:
              listing = ["ps", "-eo", "pid=,args="]
          out = subprocess.run(listing, capture_output=True, text=True, check=True).stdout
          leaked = [line for line in out.splitlines() if "squads" in line and line.rstrip().endswith("daemon run")]
          runtime = runtime_directory(os.environ, sys.platform)
          files = sorted(p for p in runtime.glob("*") if p.suffix in (".json", ".sock")) if runtime.is_dir() else []
          for log in sorted(runtime.glob("*.log")) if runtime.is_dir() else []:
              print(f"--- {log}\n{log.read_text(errors='replace')[-4000:]}")
          for line in leaked:
              print(f"leaked daemon process: {line.strip()}")
          for path in files:
              print(f"leaked daemon file: {path}")
          sys.exit(1 if leaked or files else 0)
          PY

  remote-mode:
    # The CLI surface suite with every call going over the wire to a daemon (ADR-1172 "Mode
    # parity"), on the bundled squad, once per OS. Windows is held to the same 10 minutes as the
    # others: the suite is `tests/cli` only, not the full run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SQUADS_DAEMON: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen --all-extras
      - name: pytest in remote mode
        run: uv run pytest -rs --api-mode remote tests/cli
      - name: No daemon left running
        # Fails when a `squads daemon run` process or a daemon file outlives the tests, and prints
        # the daemon logs of the runtime directory. The directory is resolved by squads itself.
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY'
          import os, subprocess, sys
          from squads._endpoint import runtime_directory
          if sys.platform == "win32":
              listing = ["powershell", "-NoProfile", "-Command",
                         'Get-CimInstance Win32_Process | ForEach-Object { "$($_.ProcessId) $($_.CommandLine)" }']
          else:
              listing = ["ps", "-eo", "pid=,args="]
          out = subprocess.run(listing, capture_output=True, text=True, check=True).stdout
          leaked = [line for line in out.splitlines() if "squads" in line and line.rstrip().endswith("daemon run")]
          runtime = runtime_directory(os.environ, sys.platform)
          files = sorted(p for p in runtime.glob("*") if p.suffix in (".json", ".sock")) if runtime.is_dir() else []
          for log in sorted(runtime.glob("*.log")) if runtime.is_dir() else []:
              print(f"--- {log}\n{log.read_text(errors='replace')[-4000:]}")
          for line in leaked:
              print(f"leaked daemon process: {line.strip()}")
          for path in files:
              print(f"leaked daemon file: {path}")
          sys.exit(1 if leaked or files else 0)
          PY

  remote-mode-override:
    # The same run on the override test squad: the only run whose vocabulary hash covers a present
    # workflow override and that sends custom fields, kinds and attributes over the wire.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQUADS_DAEMON: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen --all-extras
      - name: pytest in remote mode on the override squad
        run: uv run pytest --api-mode remote --squad override tests/cli
      - name: No daemon left running
        # Fails when a `squads daemon run` process or a daemon file outlives the tests, and prints
        # the daemon logs of the runtime directory. The directory is resolved by squads itself.
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY'
          import os, subprocess, sys
          from squads._endpoint import runtime_directory
          if sys.platform == "win32":
