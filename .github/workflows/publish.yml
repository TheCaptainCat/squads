name: publish

# Fires when a GitHub Release is published (publishing also creates the tag).
# The release already exists when this runs, so the VSIX job attaches its
# asset to that release directly rather than creating one.
#
# workflow_dispatch is a manual recovery path for a missed or failed release
# event (e.g. a delivery outage) — it targets an EXISTING release/tag and
# mutates nothing new: uv publish is a no-op on a version already on PyPI, the
# tag-vs-pyproject-version guard below still applies (it fails closed on a
# mismatched or malformed tag), and the VSIX step re-attaches to the same
# release. It does not create a release and does not skip the version guard.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)publish, e.g. v0.12.3 — must match pyproject.toml's version"
        required: true
        type: string

# Single source of truth for "which release is this run acting on", so every
# step below reads one place instead of the raw event payload: on the release
# trigger that's github.event.release.tag_name; on workflow_dispatch there is
# no release object, so it's the operator-supplied input instead. Referencing
# github.event.release.tag_name directly from a workflow_dispatch run resolves
# to an empty string rather than erroring, so this indirection is what keeps
# that path from silently no-oping.
env:
  release_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}

jobs:
  publish:
    name: publish core to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      # Explicit ref so a workflow_dispatch run builds the tagged commit the
      # operator named, not whatever branch happened to be selected in the
      # "Run workflow" ref picker (on the release trigger this is the same
      # commit checkout would have picked anyway).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.release_tag }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - run: uv sync --frozen

      - name: read core version (unified version)
        id: core-version
        run: |
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: version guard - tag must match core version
        run: |
          expected="v${{ steps.core-version.outputs.version }}"
          actual="${{ env.release_tag }}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Release tag '${actual}' does not match core version '${expected}' from pyproject.toml - bump pyproject.toml or fix the tag before this can publish to PyPI."
            exit 1
          fi

      - name: regenerate template manifest
        run: python scripts/gen_template_manifest.py
      - run: uv build
      - run: uv publish

      - name: verify the version landed on PyPI
        run: |
          version="${{ steps.core-version.outputs.version }}"
          for _ in 1 2 3 4 5; do
            if curl -sf "https://pypi.org/pypi/squads/${version}/json" > /dev/null; then
              echo "confirmed: squads ${version} is live on PyPI"
              exit 0
            fi
            sleep 5
          done
          echo "::error::squads ${version} was not retrievable from PyPI's public JSON API after publish - the upload step reported success but the package index does not show it."
          exit 1

  vsix:
    name: build + attach VSIX release asset
    runs-on: ubuntu-latest
    environment: vscode.marketplace
    permissions:
      contents: write
    steps:
      # See the publish job's checkout step: same reasoning for pinning the
      # ref explicitly to the release this run is acting on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.release_tag }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - run: uv sync --frozen

      - name: read core version (unified version)
        id: core-version
        run: |
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: version guard - tag must match core version
        run: |
          expected="v${{ steps.core-version.outputs.version }}"
          actual="${{ env.release_tag }}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Release tag '${actual}' does not match core version '${expected}' from pyproject.toml - bump pyproject.toml or fix the tag before this can ship a VSIX."
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      - name: install client dependencies
        working-directory: clients/vscode
        run: npm ci

      - name: compile
        working-directory: clients/vscode
        run: npm run compile

      - name: set client version to the core version
        working-directory: clients/vscode
        run: npm version "${{ steps.core-version.outputs.version }}" --no-git-tag-version --allow-same-version

      # vsce always ships README.md as the marketplace overview; swap in the
      # adopter-facing MARKETPLACE.md here (ephemeral CI checkout only — the
      # committed README.md stays the repo/contributor doc).
      - name: use marketplace README for the VSIX overview
        working-directory: clients/vscode
        run: cp MARKETPLACE.md README.md

      # vsce warns and ships the VSIX with no license text if it can't find a LICENSE file
      # next to package.json; clients/vscode has none of its own (ephemeral CI checkout only —
      # the root LICENSE stays the one committed copy, so there's nothing to keep in sync).
      - name: copy root LICENSE for the VSIX
        working-directory: clients/vscode
        run: cp ../../LICENSE LICENSE

      - name: package VSIX
        working-directory: clients/vscode
        run: npx @vscode/vsce package --no-dependencies -o "../../squads-vscode-${{ steps.core-version.outputs.version }}.vsix"

      # Publish the just-built VSIX (which carries the swapped marketplace README) to the
      # VS Code Marketplace. Gated on the VSCE_PAT secret so the release still succeeds and
      # attaches the VSIX below even before the token/publisher are configured.
      - name: publish to the VS Code Marketplace
        working-directory: clients/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --packagePath "../../squads-vscode-${{ steps.core-version.outputs.version }}.vsix"

      - name: attach VSIX to the tagged release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.release_tag }}" squads-vscode-*.vsix --clobber
